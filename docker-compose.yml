services:
  kinoko:
    build: .
    container_name: kinoko
    depends_on:
      kinoko-db:
        condition: service_healthy
    ports:
      - 8484:8484
      - 8585-8588:8585-8588
    volumes:
      - ./data:/kinoko/data
      - kinoko-wz-vol:/kinoko/wz
    environment:
      # ServerConstants
      CENTRAL_HOST: "127.0.0.1"
      CENTRAL_PORT: "8282"
      SERVER_HOST: "192.168.245.70"
      DATABASE_PROVIDER: "cassandra"
      DATABASE_HOST: "kinoko-db" 
      # ServerConfig
      WORLD_ID: "0"
      WORLD_NAME: "Kinoko"
      CHANNEL_COUNT: "4"
      AUTO_CREATE_ACCOUNT: "true"
      REQUIRE_SECONDARY_PASSWORD: "false"
      WZ_DIRECTORY: "/kinoko/wz"
      DATA_DIRECTORY: "/kinoko/data"
      COMMAND_PREFIX: "!"
      DEBUG_MODE: "false"
      # Rate multipliers
      EXP_RATE: "10"
      MESO_RATE: "10"
      DROP_RATE: "10"

  kinoko-db:
    image: cassandra:5.0.0-jammy
    container_name: kinoko_cassandra
    ports:
      - 9042:9042
    environment:
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    healthcheck:
      test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9042' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

# NEW DEFINITIONS SECTION:
volumes:
  kinoko-wz-vol:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      # Points directly to the './wz' folder relative to this file
      device: '${PWD}/wz' 
